<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="theme-color" content="#315c45" />
        <title>Offline - Bible Tracker</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family: system-ui, sans-serif;
            }
            body {
                min-height: 100svh;
                margin: 0;
                display: grid;
                place-items: center;
                background: #f8faf8;
                color: #183326;
            }
            main {
                max-width: 28rem;
                padding: 2rem;
                text-align: center;
            }
            img {
                width: 5rem;
                height: 5rem;
            }
            p {
                line-height: 1.6;
            }
            a,
            button {
                display: inline-block;
                margin: 0.5rem;
                padding: 0.75rem 1rem;
                border: 0;
                border-radius: 0.6rem;
                background: #315c45;
                color: white;
                font: inherit;
                text-decoration: none;
                cursor: pointer;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #101713;
                    color: #edf5ef;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/pwa-icon.svg" alt="" />
            <h1>You're offline</h1>
            <p>
                To read without a connection, download chapters from Downloads
                while online. Your account pages need a connection.
            </p>
            <p>
                If you have prepared downloads, open the offline reader.
                Otherwise reconnect to finish setting it up.
            </p>
            <a href="/offline">Open offline reader</a
            ><button onclick="location.reload()">Try again</button>
        </main>
    </body>
</html>
